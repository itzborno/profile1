<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>borno_69 Profile</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Varela+Round&display=swap" rel="stylesheet">

    <style>
        /* Basic Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Varela Round', sans-serif;
            background: #000;
            cursor: none; /* ডিফল্ট কার্সার লুকানোর জন্য */
        }

        /* Custom Cursor Style */
        #custom-cursor {
            width: 20px;
            height: 20px;
            background: rgba(189, 104, 238, 0.4);
            border: 2px solid #bd68ee;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
        }

        /* Background Fix */
        .video-background-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        .video-background-container img {
            width: 100%; height: 100%;
            object-fit: cover;
            /* ব্যাকগ্রাউন্ড ব্লার করার মেইন লাইন */
            filter: blur(20px) brightness(0.5);
        }

        /* Snow Container */
        #snow-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1em;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(105vh); }
        }

        /* Main Card */
        .card {
            position: relative;
            width: 380px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 45px 20px 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        /* Hover Effect for Cursor on Links */
        a:hover ~ #custom-cursor {
            transform: translate(-50%, -50%) scale(1.5);
            background: rgba(189, 104, 238, 0.8);
        }

        .profile-container {
            position: relative;
            width: 105px; height: 105px;
            margin: 0 auto 15px;
        }
        
        .crown {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 75px;
            z-index: 2;
        }
        
        .profile-pic {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(189, 104, 238, 0.5);
        }

        .username {
            font-size: 28px;
            color: #bd68ee;
            font-weight: 600;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(189, 104, 238, 0.3);
        }
        
        .bio {
            font-family: 'UnifrakturMaguntia', cursive;
            color: #bfaec2;
            font-size: 17px;
            margin-bottom: 25px;
        }

        .discord-box {
            background: rgba(30, 20, 30, 0.6);
            border-radius: 18px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 90%;
            margin: 0 auto 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .discord-avatar { width: 42px; height: 42px; border-radius: 50%; }
        .discord-info { text-align: left; }
        .discord-name { color: #fff; font-size: 14px; font-weight: 600; }
        .discord-status { font-size: 10px; color: #aaa; letter-spacing: 1px; margin-top: 2px; }

        .social-icons { display: flex; justify-content: center; gap: 18px; }
        .social-icons a {
            color: white; font-size: 22px;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
            transition: 0.3s;
        }
        .social-icons a:hover { transform: scale(1.2); }

        .audio-btn {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.1);
            border: none; color: white;
            width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer;
            backdrop-filter: blur(5px); z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Custom Cursor -->
    <div id="custom-cursor"></div>

    <div id="snow-container"></div>

    <div class="video-background-container">
        <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3dG0wN2M0bzEwb2VjbXZpY2RlM3pyMmdib2t1emxpNzUxNGh4cWx2aSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/6FMCMhZ1pGMKbPjYB8/giphy.gif" class="video-background-container">
    </div>

    <audio id="bgMusic" loop>
        <source src="https://audio.jukehost.co.uk/019ddcbb-4f94-7059-9d73-c43adfde20b1" type="audio/mpeg">
    </audio>

    <button class="audio-btn" id="audioToggle">
        <i class="fa-solid fa-volume-xmark"></i>
    </button>

    <div class="card">
        <div class="profile-container">
            <img src="https://i.postimg.cc/Z5zzk79y/Savage-removedbg-preview.png" alt="Crown" class="crown">
            <img src="https://media1.tenor.com/m/WzWXzEu1JTAAAAAd/idleglance-amv.gif" alt="Profile" class="profile-pic">
        </div>

        <h1 class="username">BORNO_69</h1>
        <p class="bio">Nothing To Say</p>

        <div class="discord-box">
            <img src="https://media1.tenor.com/m/WzWXzEu1JTAAAAAd/idleglance-amv.gif" alt="Discord" class="discord-avatar">
            <div class="discord-info">
                <div class="discord-name">mrbatpar <span style="font-size: 10px; opacity: 0.6;">🍃 ATHX</span></div>
                <div class="discord-status">👑 D A D D Y ' S ‿ H O M E</div>
            </div>
        </div>

        <div class="social-icons">
            <a href="https://discord.com/users/1178714666696974348" target="_blank" title="Discord"><i class="fa-brands fa-discord"></i></a>
            <a href="https://youtube.com/channel/UCUj9bTW0m1_6Gbl8cfUgJlA" target="_blank" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://t.me/MrFucker069" target="_blank" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
            <a href="https://github.com/itzborno" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
        </div>
    </div>

    <script>
        // Custom Cursor Logic
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Snow Creation Logic
        const snowContainer = document.getElementById('snow-container');
        const snowCount = 50;

        for (let i = 0; i < snowCount; i++) {
            const snow = document.createElement('div');
            snow.className = 'snowflake';
            snow.innerHTML = '❄';
            snow.style.left = Math.random() * 100 + 'vw';
            snow.style.opacity = Math.random();
            snow.style.fontSize = (Math.random() * 10 + 10) + 'px';
            snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
            snowContainer.appendChild(snow);
        }

        // Audio Logic
        const music = document.getElementById('bgMusic');
        const audioBtn = document.getElementById('audioToggle');
        const icon = audioBtn.querySelector('i');

        document.body.addEventListener('click', function() {
            if (music.paused) {
                music.play().then(() => {
                    icon.classList.replace('fa-volume-xmark', 'fa-volume-high');
                }).catch(e => console.log("Audio play failed"));
            }
        }, { once: true });

        audioBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if(music.paused) {
                music.play();
                icon.classList.replace('fa-volume-xmark', 'fa-volume-high');
            } else {
                music.pause();
                icon.classList.replace('fa-volume-high', 'fa-volume-xmark');
            }
        });
    </script>
</body>
</html>
